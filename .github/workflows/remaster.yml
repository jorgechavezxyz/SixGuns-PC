name: Remaster desktop packages
on:
  push:
    branches: [remaster-nx, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Installer safety tests
        run: dotnet run --project tests/Remaster.Installer -c Release
      - name: Build self-contained launcher
        run: dotnet publish src/Ryujinx -c Release -r ${{ matrix.rid }} -p:RuntimeIdentifiers=${{ matrix.rid }} --self-contained true -o desktop-publish
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item desktop-publish/Ryujinx.exe 'Six Guns Remaster-NX.exe'
          Copy-Item REMASTER.md 'desktop-publish/START HERE.md'
          Compress-Archive desktop-publish/* SixGuns-Remaster-NX-${{ matrix.rid }}.zip
      - name: Package and verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='Six Guns Remaster-NX.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R desktop-publish/. "$app/Contents/MacOS/"
          cp distribution/macos/Remaster-Info.plist "$app/Contents/Info.plist"
          cp distribution/macos/Ryujinx.icns LICENSE.txt "$app/Contents/Resources/"
          chmod +x "$app/Contents/MacOS/Ryujinx"
          find "$app/Contents/MacOS" -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements distribution/macos/entitlements.xml "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" SixGuns-Remaster-NX-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SixGuns-Remaster-NX-${{ matrix.rid }}
          path: SixGuns-Remaster-NX-*.zip
