name: Remaster desktop packages
on:
  push:
    branches: [remaster-nx, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # distribution/sixguns-nx.ref: "latest-release" (the newest SixGuns-NX release, the port Switch players update
      # to) or a commit to pin (only to hold back or roll back a port).
      - name: Resolve SixGuns-NX port
        id: nx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=$(head -n1 distribution/sixguns-nx.ref | tr -d '[:space:]')
          if [ "$want" = "latest-release" ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/jorgechavezxyz/SixGuns-NX/releases?per_page=5" > nx-releases.json
            python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          for r in json.load(open('nx-releases.json')):
              nro = [a for a in r['assets'] if a['name'] == 'sixguns.nro' and (a.get('digest') or '').startswith('sha256:')]
              if r['draft'] or not nro: continue
              print('ref=' + r['tag_name']); print('tag=' + r['tag_name']); print('nro_sha256=' + nro[0]['digest'][7:]); break
          else:
              raise SystemExit('No SixGuns-NX release with sixguns.nro')
          EOF
          else
            echo "ref=$want" >> "$GITHUB_OUTPUT"; echo "tag=" >> "$GITHUB_OUTPUT"; echo "nro_sha256=" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      # The game is installed by the Switch port's own SD Builder (command-line build) from that commit, with the
      # sixguns.nro it carries: desktop and Switch players get identical builds.
      - uses: actions/checkout@v4
        with:
          repository: jorgechavezxyz/SixGuns-NX
          ref: ${{ steps.nx.outputs.ref }}
          path: sixguns-nx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the SD Builder
        shell: bash
        run: |
          python -m pip install pyinstaller numpy
          (cd sixguns-nx && python -m PyInstaller --noconfirm tools/packaging/sd_builder_cli.spec)
          cp -R sixguns-nx/dist/sixguns-sd-build sd-builder
          # commit (which builder made an installed game: rebuild after updates), commit date (PortUpdater only
          # takes newer releases), release tag
          git -C sixguns-nx log -1 --format='%H%n%cI' > sd-builder/sixguns-nx.ref
          echo "${{ steps.nx.outputs.tag }}" >> sd-builder/sixguns-nx.ref
          cat sd-builder/sixguns-nx.ref
          nro=$(python -c "import hashlib;print(hashlib.sha256(open('sixguns-nx/tools/packaging/sixguns.nro','rb').read()).hexdigest())")
          # The bundled port must be byte-identical to the release Switch players download.
          if [ -n "${{ steps.nx.outputs.nro_sha256 }}" ] && [ "$nro" != "${{ steps.nx.outputs.nro_sha256 }}" ]; then
            echo "tools/packaging/sixguns.nro at ${{ steps.nx.outputs.tag }} ($nro) differs from the release's sixguns.nro"; exit 1
          fi
          exe=sd-builder/sixguns-sd-build; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --self-test | tee sd-builder-selftest.txt
          grep -q "nro_sha256=$nro" sd-builder-selftest.txt
      - name: Installer safety tests
        shell: bash
        run: |
          exe="$PWD/sd-builder/sixguns-sd-build"; [ -f "$exe.exe" ] && exe="$exe.exe"
          SIXGUNS_SD_BUILD="$exe" dotnet run --project tests/Remaster.Installer -c Release
      - name: Build self-contained launcher
        run: dotnet publish src/Ryujinx -c Release -r ${{ matrix.rid }} -p:RuntimeIdentifiers=${{ matrix.rid }} --self-contained true -o desktop-publish
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item desktop-publish/Ryujinx.exe 'Six Guns Remaster-NX.exe'
          Copy-Item REMASTER.md 'desktop-publish/START HERE.md'
          Compress-Archive desktop-publish/* SixGuns-Remaster-NX-${{ matrix.rid }}.zip
      - name: Update manifest (attach update.json to a release to offer it as an update)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -c "import json,re; v=re.search(r'<Version>([^<]+)</Version>', open('src/Ryujinx/Ryujinx.csproj', encoding='utf-8').read()).group(1); json.dump({'version': v, 'commit': '${{ github.sha }}'}, open('update.json', 'w'))"
          cat update.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: update-manifest
          path: update.json
      - name: Windows first-run smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'remaster-first-run'
          New-Item -ItemType Directory -Force $root | Out-Null
          $process = Start-Process -FilePath './desktop-publish/Six Guns Remaster-NX.exe' -ArgumentList "--root-data-dir $root" -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "Launcher exited during first run: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Package and verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='Six Guns Remaster-NX.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R desktop-publish/. "$app/Contents/MacOS/"
          mv "$app/Contents/MacOS/sixguns.nro" "$app/Contents/Resources/"
          mv "$app/Contents/MacOS/THIRDPARTY.md" "$app/Contents/MacOS/LICENSE.txt" "$app/Contents/MacOS/LICENSE-REMASTER.txt" "$app/Contents/Resources/"
          cp distribution/macos/Remaster-Info.plist "$app/Contents/Info.plist"
          cp distribution/macos/Ryujinx.icns LICENSE.txt "$app/Contents/Resources/"
          mv "$app/Contents/MacOS/Ryujinx" "$app/Contents/MacOS/SixGunsRemasterNX"
          chmod +x "$app/Contents/MacOS/SixGunsRemasterNX"
          # The SD Builder goes in Contents/Resources (codesign rejects data files in subfolders of Contents/MacOS),
          # copied with ditto so its Python.framework keeps its symlinked bundle layout (the
          # .NET publish copy flattens it, and a flattened framework cannot be signed), then signed: the framework
          # as a bundle, every other Mach-O file on its own, before the app itself.
          rm -rf "$app/Contents/MacOS/sd-builder"
          ditto sd-builder "$app/Contents/Resources/sd-builder"
          chmod +x "$app/Contents/Resources/sd-builder/sixguns-sd-build"
          find "$app/Contents/MacOS" -name '*.dylib' -not -path '*/sd-builder/*' -exec codesign --force --sign - {} \;
          find "$app/Contents/Resources/sd-builder" -name '*.framework' -type d -prune -print0 | while IFS= read -r -d '' fw; do
            codesign --force --sign - "$fw"
          done
          find "$app/Contents/Resources/sd-builder" -path '*.framework' -prune -o -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q Mach-O; then codesign --force --sign - "$f"; fi
          done
          "$app/Contents/Resources/sd-builder/sixguns-sd-build" --self-test
          codesign --force --sign - --entitlements distribution/macos/entitlements.xml "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/remaster-first-run"
          "$app/Contents/MacOS/SixGunsRemasterNX" --root-data-dir "$RUNNER_TEMP/remaster-first-run" > "$RUNNER_TEMP/launcher-smoke.log" 2>&1 &
          launcher_pid=$!
          sleep 20
          if ! kill -0 "$launcher_pid" 2>/dev/null; then cat "$RUNNER_TEMP/launcher-smoke.log"; exit 1; fi
          kill "$launcher_pid"
          ditto -c -k --keepParent "$app" SixGuns-Remaster-NX-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SixGuns-Remaster-NX-${{ matrix.rid }}
          path: SixGuns-Remaster-NX-*.zip
